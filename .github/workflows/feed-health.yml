# Nightly live-feed probe: subrequest budget, parser drift, discover coverage,
# and feeds resting for 48 h+. Short upstream outages appear in the job
# summary without failing the run. Local mirror: `npm run probe:feeds`.
name: Feed health

on:
  schedule:
    - cron: "17 11 * * *" # daily, 11:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Probe live feeds
        run: npm run probe:feeds
