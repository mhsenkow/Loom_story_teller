<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loom MCP — chat demo</title>
<style>
  :root {
    --bg: #f4f4f2; --bubble: #fff; --ink: #111; --mute: #666; --accent: #6c5ce7;
    font-family: Inter, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); min-height: 100dvh; padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
  .lead { font-size: 0.85rem; color: var(--mute); margin-bottom: 16px; }
  .msg { background: var(--bubble); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .msg.user { background: #ebe8ff; }
  .label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin-bottom: 6px; }
  iframe { width: 100%; height: 360px; border: 0; border-radius: 10px; background: #0a0a0c; margin-top: 10px; }
  button {
    margin-top: 8px; appearance: none; border: 0; background: var(--accent); color: #fff;
    font: 600 12px Inter, sans-serif; padding: 10px 14px; border-radius: 8px; cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Loom in ChatGPT (mock)</h1>
  <p class="lead">Shows the Apps SDK-style widget after a <code>recommend_charts</code> call. For the live plugin, connect the MCP URL in Developer Mode.</p>
  <div class="msg user">
    <div class="label">You</div>
    Suggest charts for this sales CSV…
  </div>
  <div class="msg">
    <div class="label">Assistant · tool</div>
    Calling <code>recommend_charts</code>…
    <div id="status" style="font-size:12px;color:var(--mute);margin-top:6px">Loading…</div>
    <iframe id="frame" title="Loom widget"></iframe>
  </div>
  <button type="button" id="rerun">Re-run demo</button>
</div>
<script>
async function run() {
  var status = document.getElementById("status");
  var frame = document.getElementById("frame");
  status.textContent = "Calling MCP…";
  var csv = "category,value,region\nA,10,West\nB,20,East\nA,15,West\nC,8,North";
  try {
    var res = await fetch(location.origin + "/mcp", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json, text/event-stream" },
      body: JSON.stringify({
        jsonrpc: "2.0", id: 1, method: "tools/call",
        params: { name: "recommend_charts", arguments: { csv: csv, limit: 5 } }
      })
    });
    var raw = await res.text();
    var structured = null;
    try {
      var j = JSON.parse(raw);
      structured = j.result && j.result.structuredContent;
    } catch (_) {
      var m = raw.match(/"structuredContent"\s*:\s*(\{[\s\S]*?\})\s*[,}]/);
      if (m) {
        try { structured = JSON.parse(m[1]); } catch (e2) {}
      }
      // SSE: take first data: JSON line
      if (!structured) {
        var lines = raw.split("\n");
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf("data: ") === 0) {
            try {
              var payload = JSON.parse(lines[i].slice(6));
              structured = payload.result && payload.result.structuredContent;
              if (structured) break;
            } catch (e3) {}
          }
        }
      }
    }
    if (structured) {
      status.textContent = "Got " + (structured.recommendations || []).length + " suggestions";
      frame.src = "/preview?seed=" + encodeURIComponent(JSON.stringify(structured));
    } else {
      status.textContent = "Response received (see /demo for raw JSON). Opening empty widget.";
      frame.src = "/preview";
    }
  } catch (e) {
    status.textContent = String(e);
  }
}
document.getElementById("rerun").onclick = run;
run();
</script>
</body>
</html>
