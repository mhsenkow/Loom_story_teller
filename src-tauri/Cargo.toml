[package]
name = "loom"
version = "0.1.1"
description = "Loom — Local-first data storytelling"
authors = ["Loom Storyteller Contributors"]
license = "MIT"
repository = "https://github.com/mhsenkow/Loom_story_teller"
edition = "2021"

[lib]
name = "loom_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: DuckDB, folder FS, native dialogs, Rust poll/SSE sources
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
opener = "0.7"
# Bundled only: static parquet/json fail to compile against current Xcode libc++
# (thrift TEnumIterator). Never INSTALL extensions at runtime — that drops
# ad-hoc–signed binaries into ~/.duckdb and Gatekeeper blocks them on MAS builds.
duckdb = { version = "1.2", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
glob = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
log = "0.4"
tauri-plugin-log = "2"
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
